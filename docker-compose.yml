services:
  frontend:
    image: saikishore1903/chatapp_front-end
    ports: 
    - "80:80"
    depends_on: 
    - backend
    networks: 
    - chat-network
    environment: 
    - BACKEND_URL=http://backend:5001
    restart: always
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:80 || exit 1"]
      interval: 30s
      start_period: 5s
      timeout: 10s
      retries: 5
  backend:
    image: saikishore1903/chatapp-backend
    ports:
    - "5001:5001"
    depends_on:
    - mongo
    networks:
    - chat-network
    environment:
    - MONGODB_URI=mongodb://root:admin@mongo:27017/chatApp?authSource=admin
    - PORT=5001
    - NODE_ENV=production
    - JWT_SECRET=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..YTeR6zLCKuOPjz5CYfwxW1gXp_wP1gAnN3qSMJIFQFg
    restart: always
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      start_period: 5s
      timeout: 10s
      retries: 5

  mongo:
    image: iemafzal/mongodb:v1
    ports:
    - "27017:27017"
    networks:
    - chat-network
    environment:
    - MONGO_INITDB_ROOT_USERNAME=root
    - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
    - mongodb_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval 'db.adminCommand(\"ping\")' --username root --password admin --authenticationDatabase admin || exit 1"]
      interval: 30s
      start_period: 5s
      timeout: 10s
      retries: 5

networks:
  chat-network: 
volumes:
  mongodb_data: